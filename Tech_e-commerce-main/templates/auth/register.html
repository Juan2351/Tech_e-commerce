{% extends "base.html" %}
{% block title %}Crear Cuenta | LePetit{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Crear Cuenta</h1>
            <p class="muted">Completa los datos para registrarte como cliente en LePetit.</p>
        </div>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form class="auth-form" method="post" action="{{ url_for('auth.register') }}">
            <label for="nombre">
                Nombre Completo
                <input id="nombre" type="text" name="nombre" placeholder="Ej. Valentina Gómez" required maxlength="80">
            </label>

            <label for="email">
                Correo Electrónico
                <input id="email" type="email" name="email" placeholder="valentina@correo.com" required maxlength="100">
            </label>

            <div class="form-row-two">
                <label for="telefono">
                    Teléfono (Opcional)
                    <input id="telefono" type="tel" name="telefono" placeholder="+57 300 123 4567" maxlength="30">
                </label>
                <label for="ciudad">
                    Ciudad (Opcional)
                    <input id="ciudad" type="text" name="ciudad" placeholder="Medellín / Bogotá" maxlength="50">
                </label>
            </div>

            <label for="password">
                Contraseña
                <input id="password" type="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
            </label>

            <label for="confirm_password">
                Confirmar Contraseña
                <input id="confirm_password" type="password" name="confirm_password" minlength="6" placeholder="Repite tu contraseña" required>
            </label>

            <button type="submit" class="button button-auth">Registrarme</button>
        </form>

        <div class="auth-footer-link">
            <p>¿Ya tienes una cuenta registrada? <a href="{{ url_for('auth.login') }}">Inicia sesión aquí</a></p>
        </div>
    </div>
</section>
{% endblock %}
