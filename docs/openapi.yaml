openapi: 3.0.3
info:
  title: LePetit API
  version: 1.0.0
  description: API REST para el catálogo y el carrito temporal de LePetit.
servers:
  - url: http://127.0.0.1:5000/api/v1
    description: Servidor local de desarrollo
paths:
  /salud:
    get:
      summary: Verificar conectividad del backend con MySQL
      responses:
        "200":
          description: Consulta SQL de salud exitosa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok] }
                      database: { type: string }
                      engine: { type: string, enum: [MySQL] }
                      connection: { type: boolean }
                      usd_to_cop_rate: { type: string }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /productos:
    get:
      summary: Listar y filtrar productos
      parameters:
        - in: query
          name: category_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: subcategory_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [featured, price_asc, price_desc, rating_desc]
      responses:
        "200":
          description: Productos encontrados, con precio de salida en COP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /productos/{id}:
    get:
      summary: Consultar un producto
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Producto encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /categorias:
    get:
      summary: Listar categorías con sus subcategorías
      responses:
        "200":
          description: Categorías y subcategorías.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /carrito:
    get:
      summary: Consultar el carrito de la sesión actual
      responses:
        "200":
          description: Líneas del carrito y total en COP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cart" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /carrito/productos:
    post:
      summary: Agregar una unidad o varias unidades al carrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string, example: LP-001 }
                quantity: { type: integer, minimum: 1, example: 1 }
      responses:
        "201":
          description: Producto agregado al carrito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      product_id: { type: string }
                      quantity: { type: integer }
                      cart_count: { type: integer }
                      message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La cantidad solicitada supera el stock disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /carrito/productos/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    patch:
      summary: Cambiar la cantidad del producto en el carrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Cantidad actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      product_id: { type: string }
                      quantity: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La cantidad solicitada supera el stock disponible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Quitar un producto del carrito
      responses:
        "204": { description: Producto retirado. }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema: { type: string, maxLength: 64 }
  schemas:
    Product:
      type: object
      properties:
        id_producto: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        precio_base_usd: { type: string, description: Precio base leído de MySQL }
        precio: { type: integer, description: Precio convertido a COP }
        moneda: { type: string, enum: [COP] }
        rating: { type: string }
        reviews_count: { type: integer }
        stock: { type: integer }
        image_url: { type: string }
        marca: { type: string }
        subcategoria: { type: string }
        categoria: { type: string }
    Category:
      type: object
      properties:
        id_main_cat: { type: integer }
        nombre: { type: string }
        subcategorias:
          type: array
          items:
            type: object
            properties:
              id_subcat: { type: integer }
              id_main_cat: { type: integer }
              nombre: { type: string }
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              producto: { $ref: "#/components/schemas/Product" }
              cantidad: { type: integer }
              subtotal: { type: integer, description: Valor en COP }
        total: { type: integer, description: Valor en COP }
        moneda: { type: string, enum: [COP] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Parámetro, JSON o cantidad inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Producto o línea de carrito inexistente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatabaseUnavailable:
      description: Configuración o conexión MySQL no disponible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
